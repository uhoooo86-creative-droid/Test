<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세윤이 낱말 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/*
VOICE: 다정한 공부 짝꿍. 짧게 풀고, 바로 뜻을 알려 주는 앱.
IDEA: 손안의 낱말 문제집. 한 번에 한 문제, 큰 보기 버튼.
PICTURE: 문제 카드 자체가 화면의 주인공. 홈은 과목별 진도 카드.
COLOUR and TYPE: 국어 산호, 사회 청록, 과학 남색. Jua 제목 + Gowun Dodum 본문.
LAYOUT: 휴대폰 한 칸 세로 흐름, 상단 뒤로가기 막대, 엄지로 닿는 큰 버튼.
*/
:root{color-scheme:light dark;--bg:light-dark(#fbf7f2,#14161d);--card:light-dark(#fff,#1f2230);--ink:light-dark(#1d1b22,#f2efe9);--mute:light-dark(#6b6670,#a9a5b3);--line:light-dark(#e8e0d6,#30344a);--ok:#1f9d55;--okb:light-dark(#dcf5e6,#173826);--no:#d64541;--nob:light-dark(#fde3e1,#3d1d1d);--ac:#e2574c;--acs:light-dark(#fde5e2,#3a2326)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
[data-s="사회"]{--ac:#0f8b8d;--acs:light-dark(#dbf1f1,#16302f)}
[data-s="과학"]{--ac:#4054d6;--acs:light-dark(#e3e7ff,#1e2347)}
[data-s="전체"]{--ac:#8a5cd0;--acs:light-dark(#efe6fb,#2a2140)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 32px)}
h1,h2,.jua{font-family:Jua,sans-serif;font-weight:400}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px}
.sub{color:var(--mute);font-size:15px;margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.sc{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.sc b{font:400 22px Jua,sans-serif;color:var(--ac)}
.sc small{color:var(--mute);font-size:14px}
.sc[aria-pressed=true]{border-color:var(--ac);background:var(--acs)}
.meter{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac);border-radius:9px}
.units{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
.units button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:15px}
.units button[aria-pressed=true]{background:var(--acs);border-color:var(--ac);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{border:0;border-radius:20px;padding:16px;min-height:112px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);border:2px solid var(--line)}
.mode.big{grid-column:1/-1;background:var(--ac);border-color:var(--ac);color:#fff;min-height:120px}
.mode b{font:400 23px Jua,sans-serif}
.mode span{font-size:14px;opacity:.85}
.mode svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.top svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.top .t{flex:1;font:400 19px Jua,sans-serif}
.top .n{color:var(--mute);font-size:15px;white-space:nowrap}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:var(--ac)}
.qtype{font-size:14px;color:var(--ac);font-weight:700;margin:4px 0 8px}
.prompt{font-size:clamp(20px,5.4vw,24px);line-height:1.5}
.prompt.w{font:400 clamp(36px,10vw,52px)/1.1 Jua,sans-serif;text-wrap:balance}
.tagl{font-size:13px;color:var(--mute);margin-top:12px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;min-height:60px;padding:12px 16px;text-align:left;display:flex;gap:12px;align-items:center;font-size:18px;line-height:1.4}
.opt.w{font:400 22px Jua,sans-serif}
.opt i{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 14px system-ui;font-style:normal;color:var(--mute)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nob)}.opt.no i{background:var(--no);border-color:var(--no);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:18px;padding:16px;margin-top:14px;display:grid;gap:6px}
.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
.fb .v{font:400 21px Jua,sans-serif}.fb.ok .v{color:var(--ok)}.fb.no .v{color:var(--no)}
.fb .ww{font:400 24px Jua,sans-serif;display:flex;align-items:center;gap:8px}
.spk{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:inline-grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px;fill:currentColor}
.cta{width:100%;min-height:58px;border-radius:18px;border:0;background:var(--ac);color:#fff;font:400 21px Jua,sans-serif;margin-top:14px}
.ghost{width:100%;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:400 19px Jua,sans-serif;margin-top:10px}
.score{text-align:center;padding:10px 0 6px}
.score .big{font:400 clamp(64px,20vw,96px)/1 Jua,sans-serif;color:var(--ac)}
.score p{margin:6px 0 0;font-size:18px}
.list{display:grid;gap:8px;margin-top:14px}
.li{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.li b{font:400 20px Jua,sans-serif}
.li p{margin:0;grid-column:1;font-size:16px;color:var(--mute)}
.li .acts{grid-row:1/3;grid-column:2;display:flex;gap:6px}
.li .x{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.flash{min-height:330px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .fw{font:400 clamp(38px,11vw,58px)/1.1 Jua,sans-serif;text-wrap:balance}
.flash .fm{font-size:clamp(19px,5vw,22px);margin-top:16px}
.flash .hint{color:var(--mute);font-size:14px;margin-top:18px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two button{min-height:60px;border-radius:18px;font:400 20px Jua,sans-serif;border:2px solid}
.two .k{border-color:var(--no);background:var(--nob);color:var(--no)}
.two .y{border-color:var(--ok);background:var(--okb);color:var(--ok)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;white-space:nowrap}
.seg button[aria-pressed=true]{border-color:var(--ac);background:var(--acs);font-weight:700}
.player{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;margin:4px 0 16px}
.player button{min-height:70px;border-radius:20px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.player #lplay{background:var(--ac);border-color:var(--ac);color:#fff;font:400 23px Jua,sans-serif}
.player svg{width:28px;height:28px;fill:currentColor}
.dim{opacity:.08;transition:opacity .3s}
.note{font-size:14px;color:var(--mute);margin-top:18px}
.warn{background:var(--nob);border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:12px}
.bogi{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px dashed var(--ac);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:16px}
.bogi b{background:var(--ac);color:#fff;border-radius:8px;padding:0 8px;font-size:13px}
.bogi span{padding:0 6px}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--ac);text-align:center;margin:0 3px;line-height:1.3}
.blank.fill{color:var(--ac);font-weight:700}
.cho{font:400 clamp(30px,9vw,42px)/1.2 Jua,sans-serif;color:var(--ac);letter-spacing:.06em;margin-top:12px}
.hint{color:var(--mute);font-size:15px;margin-top:6px}
.txt{width:100%;font:18px "Gowun Dodum",system-ui;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.txt:focus{outline:none;border-color:var(--ac)}
.cta2,.ghost2{min-height:56px;border-radius:16px;font:400 20px Jua,sans-serif}
.cta2{border:0;background:var(--ac);color:#fff}.ghost2{border:2px solid var(--line);background:var(--card)}
.cta2:disabled,.cta:disabled{opacity:.45}
.oxs{grid-template-columns:1fr 1fr}
.opt.ox{justify-content:center;font:400 44px/1 Jua,sans-serif;min-height:96px}
.seq{display:grid;gap:6px;margin-bottom:12px;min-height:30px}
.sq{display:flex;gap:10px;align-items:flex-start;background:var(--acs);border-radius:12px;padding:10px 12px;font-size:16px}
.sq i,.mb i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 13px system-ui;font-style:normal}
.sq.good{background:var(--okb)}.sq.good i{background:var(--ok)}.sq.bad{background:var(--nob)}.sq.bad i{background:var(--no)}
.chips{display:grid;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-size:16px;min-height:52px}
.mt{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mb{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;text-align:left;font-size:15px;min-height:52px;display:flex;gap:8px;align-items:center}
.mb.on{border-color:var(--ac);background:var(--acs)}
.mb.done{border-color:var(--ac)}
.mb.good{border-color:var(--ok);background:var(--okb)}.mb.good i{background:var(--ok)}.mb.bad{border-color:var(--no);background:var(--nob)}.mb.bad i{background:var(--no)}
.ol{margin:6px 0 0;padding-left:20px}
.big2{font-size:19px}
@media(prefers-reduced-motion:reduce){.bar i,.dim{transition:none}}
</style>
</head>
<body data-s="국어">
<div class="wrap">

<section id="home">
  <h1>세윤이 낱말 앱</h1>
  <p class="sub">4학년 2학기 국어 · 사회 · 과학 핵심 낱말</p>
  <div class="subs" id="subs"></div>
  <div class="units" id="units"></div>
  <div class="modes">
    <button class="mode big" data-go="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg><div><b>문제 풀기</b><br><span id="qinfo">10문제 · 풀고 바로 뜻 확인</span></div></button>
    <button class="mode big" data-go="tb" style="background:var(--card);color:var(--ink);border-color:var(--ac)"><svg viewBox="0 0 24 24" style="color:var(--ac)"><path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-5a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h5z"/></svg><div><b style="color:var(--ac)">교과서 유형 문제</b><br><span id="tbinfo">빈칸 쓰기 · ○표 · 보기 · 순서 · 선 잇기 · 서술형</span></div></button>
    <button class="mode" data-go="exam" style="grid-column:1/-1;min-height:84px;border-color:var(--ac)"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM6 6h12v15H6z"/><path d="M9 12l2 2 4-4M9 17h6"/></svg><div><b>실전 사지선다 12문제</b> <span>국어·사회·과학 4문제씩</span></div></button>
    <button class="mode" data-go="cards"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><div><b>낱말 카드</b><br><span>눌러서 뜻 보기</span></div></button>
    <button class="mode" data-go="wrong"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10l6 6M15 10l-6 6"/></svg><div><b>오답 노트</b><br><span id="winfo">틀린 낱말 0개</span></div></button>
    <button class="mode" data-go="listen" style="grid-column:1/-1;min-height:84px"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><div><b>듣기 모드</b> <span>차에서 소리로 듣기</span></div></button>
  </div>
  <p class="note">문제를 맞히면 ‘외운 낱말’이 되고, 틀리면 오답 노트에 모여요. 기록은 이 휴대폰에만 저장돼요.</p>
</section>

<section id="quiz" hidden>
  <div class="top"><button data-home aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="t" id="qtitle">문제 풀기</span><span class="n" id="qn"></span></div>
  <div class="bar"><i id="qbar"></i></div>
  <div id="qbody"></div>
</section>

<section id="tb" hidden>
  <div class="top"><button data-home aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="t" id="tbtitle">교과서 유형 문제</span><span class="n" id="tbn"></span></div>
  <div class="bar"><i id="tbbar"></i></div>
  <div id="tbbody"></div>
</section>

<section id="cards" hidden>
  <div class="top"><button data-home aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="t">낱말 카드</span><span class="n" id="cn"></span></div>
  <div class="bar"><i id="cbar"></i></div>
  <div class="qcard flash" id="flash"></div>
  <div class="two"><button class="k" id="cno">몰라요</button><button class="y" id="cyes">알아요</button></div>
</section>

<section id="wrong" hidden>
  <div class="top"><button data-home aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="t">오답 노트</span><span class="n" id="wn"></span></div>
  <div id="wbody"></div>
</section>

<section id="listen" hidden>
  <div class="top"><button data-home aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="t">듣기 모드</span><span class="n" id="ln"></span></div>
  <div class="warn" id="lwarn" hidden>이 기기에서는 음성 읽기가 지원되지 않아요. Chrome이나 Safari에서 열어 보세요.</div>
  <div class="qcard" style="min-height:260px">
    <div class="tagl" id="ltag" style="margin-top:4px"></div>
    <div class="prompt w" id="lw" style="margin-top:10px"></div>
    <div class="prompt" id="lm" style="margin-top:10px"></div>
    <div class="tagl" id="lst">재생을 누르면 소리로 읽어 줘요.</div>
  </div>
  <div class="player">
    <button id="lprev" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="lplay">재생</button>
    <button id="lnext" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
  <div class="seg" id="lmode"><button data-v="w">낱말 → 뜻</button><button data-v="m">뜻 → 낱말 퀴즈</button></div>
  <div class="seg" id="lgap"><button data-v="2">생각 2초</button><button data-v="4">4초</button><button data-v="6">6초</button></div>
  <p class="note">화면이 꺼지면 소리가 멈출 수 있어요. 차에서는 화면을 켜 두고 블루투스로 연결하세요.</p>
</section>

</div>
<script>
{
const RAW={
"국어":{
"4단원 · 책 속의 길을 따라":`추궁|잘못한 일에 대하여 엄하게 따져서 밝힘
우물쭈물|행동 등을 분명하게 하지 못하고 자꾸 망설이며 몹시 흐리멍덩하게 하는 모양
재촉하다|어떤 일을 빨리하도록 조르다
속사포|탄알을 쉽게 장전하여 빨리 발사할 수 있는 포. 말을 쉬지 않고 빠르게 하는 모습에 비유해요
손해|물질적으로나 정신적으로 제 값어치보다 얻는 것이 적음
억울하다|아무 잘못 없이 꾸중을 듣거나 벌을 받아서 분하고 답답하다
뜬금없이|갑작스럽고도 엉뚱하게
의문|의심스럽게 생각함. 또는 그런 문제나 사실
충고|남의 결함이나 잘못을 진심으로 타이름
대충|대강을 추리는 정도로
소비 기한|먹거나 쓸 수 있는 기간
처방|병을 치료하기 위해 증상에 따라 약을 짓는 방법
개봉|열지 못하게 붙여 두었던 것을 떼거나 엶
항생제|미생물이 만들어 내는 항생 물질로 된 약제
폐의약품 수거함|더 이상 쓰지 않는 약을 모아서 따로 버리는 통
경고하다|조심하거나 삼가도록 미리 주의를 주다
요령|일을 하는 데 꼭 필요한 묘한 이치
터득하다|깊이 생각하여 이치를 깨달아 알아내다
내성|견딜 수 있는 힘. 항생제를 많이 쓰면 내성균이 생겨요

수소|산소와 반응해 전기를 만들고 사용 후 물이 나오는 친환경 연료. 수소 자동차와 버스
열기구|온도가 높아지면 기체의 부피가 늘어나는 성질을 이용해요`}};


const DATA=[];
for(const s in RAW)for(const u in RAW[s])RAW[s][u].trim().split("\n").forEach(l=>{const p=l.split("|").map(x=>x.trim());DATA.push(p.length>2?{s,u,w:p[0],x:p[1],m:p[2]}:{s,u,w:p[0],m:p[1]})});
const K=d=>d.s+"/"+d.w;
const $=id=>document.getElementById(id);
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("sy_"+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem("sy_"+k,v)}catch(e){}}};
const parse=(k)=>{try{return JSON.parse(store.get(k,"[]"))}catch(e){return[]}};
const mastered=new Set(parse("m")),wrong=new Set(parse("x"));
const save=()=>{store.set("m",JSON.stringify([...mastered]));store.set("x",JSON.stringify([...wrong]))};
const st={subj:store.get("subj","국어"),unit:store.get("unit","전체")};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>DATA.filter(d=>(st.subj==="전체"||d.s===st.subj)&&(st.unit==="전체"||d.u===st.unit));
const mask=(m,w)=>{let r=m;const keys=[w];if(/하다$/.test(w))keys.push(w.slice(0,-2));else if(/다$/.test(w))keys.push(w.slice(0,-1));keys.filter(k=>k.length>=2).forEach(k=>{r=r.split(k).join("○○")});return r};

/* 소리 */
const tts="speechSynthesis" in window;let voice=null;
const pick=()=>{if(!tts)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/ko/i.test(x.lang)&&/Google|Yuna|Sora|Heami|SunHi/i.test(x.name))||v.find(x=>/ko/i.test(x.lang))||null};
if(tts){pick();speechSynthesis.onvoiceschanged=pick}
let rate=0.95;
function say(text,tok){return new Promise(res=>{if(!tts||(tok!=null&&tok!==L.tok))return res();const u=new SpeechSynthesisUtterance(text.replace(/[‘’]/g,""));u.lang="ko-KR";if(voice)u.voice=voice;u.rate=rate;let d=false;const f=()=>{if(!d){d=true;clearTimeout(g);res()}};u.onend=f;u.onerror=f;const g=setTimeout(f,Math.max(4000,text.length*260));speechSynthesis.speak(u)})}
const spkBtn=(t)=>`<button class="spk" data-say="${esc(t)}" aria-label="소리로 듣기"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a4 4 0 0 1 0 7M18.5 6a7.5 7.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.stopPropagation();if(tts){speechSynthesis.cancel();say(b.dataset.say)}}},true);

/* 문제 풀기 */
const Q={list:[],i:0,score:0,miss:[],title:""};
function makeQ(d){
  if(d.x){const oth=shuffle(DATA.filter(o=>o.x&&o!==d)).slice(0,2).map(o=>o.x);return{d,type:"바르게 쓴 것을 고르세요",prompt:"맞춤법 문제",pw:true,opts:shuffle([d.w,d.x,...oth]),ans:d.w,long:false}}
  const near=shuffle(DATA.filter(o=>o!==d&&!o.x&&o.s===d.s&&o.u===d.u));
  const far=shuffle(DATA.filter(o=>o!==d&&!o.x&&o.s===d.s&&o.u!==d.u));
  const ds=[...near,...far].slice(0,3);
  if(Math.random()<.5)return{d,type:"뜻을 읽고 알맞은 낱말을 고르세요",prompt:mask(d.m,d.w),pw:false,opts:shuffle([d,...ds]).map(o=>o.w),ans:d.w,long:false};
  return{d,type:"이 낱말의 뜻으로 알맞은 것은?",prompt:d.w,pw:true,opts:shuffle([d,...ds]).map(o=>mask(o.m,o.w)),ans:mask(d.m,d.w),long:true};
}

["사회","인문환경","다음 중 인문환경에 해당하는 것은?",["산","하천","비","논"],3],
["과학","보름달","음력 15일 무렵에 볼 수 있는, 둥근 모양으로 꽉 찬 달은?",["상현달","보름달","하현달","그믐달"],1],
["과학","가장 큰 행성","태양계 행성 가운데 크기가 가장 큰 행성은?",["토성","지구","목성","해왕성"],2],
["과학","헬륨","공기보다 가벼워 위로 뜨기 때문에 풍선이나 비행선에 이용하는 기체는?",["질소","산소","이산화 탄소","헬륨"],3],

function startExam(){
  const qs=EXAM.map(([s,w,q,o,a])=>{const d=DATA.find(x=>x.s===s&&x.w===w);return{d,type:"실전 사지선다",prompt:q,pw:false,opts:o,ans:o[a],long:o.some(x=>x.length>8)}});
  Q.list=qs;Q.i=0;Q.score=0;Q.miss=[];Q.title="실전 사지선다 12문제";Q.review=false;Q.exam=true;
  $("qtitle").textContent=Q.title;renderQ();
}
function startQuiz(items,title){
  let src=items||pool();
  if(!items){const a=shuffle(src.slice());a.sort((x,y)=>mastered.has(K(x))-mastered.has(K(y)));src=a.slice(0,10)}
  Q.exam=false;Q.list=shuffle(src.slice()).map(makeQ);Q.i=0;Q.score=0;Q.miss=[];Q.title=title||"문제 풀기";Q.review=!!items;
  $("qtitle").textContent=Q.title;
  if(!Q.list.length){$("qbody").innerHTML=`<div class="empty">풀 문제가 없어요.</div>`;return}
  renderQ();
}
function renderQ(){
  const q=Q.list[Q.i];
  $("qn").textContent=`${Q.i+1} / ${Q.list.length}`;
  $("qbar").style.width=(Q.i/Q.list.length*100)+"%";
  $("qbody").innerHTML=`<div class="qcard"><div class="qtype">${q.type}</div><div class="prompt${q.pw?" w":""}">${esc(q.prompt)}</div><div class="tagl">${esc(q.d.s)} · ${esc(q.d.u)}</div></div>
  <div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt${q.long?"":" w"}" data-k="${k}"><i>${k+1}</i><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div>`;
}
$("qbody").addEventListener("click",e=>{
  const b=e.target.closest(".opt");
  if(b&&!b.disabled){
    const q=Q.list[Q.i],pickd=q.opts[+b.dataset.k],ok=pickd===q.ans,key=K(q.d);
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const v=q.opts[+x.dataset.k];if(v===q.ans)x.classList.add("ok");else if(x===b)x.classList.add("no")});
    if(ok){Q.score++;mastered.add(key);if(Q.review)wrong.delete(key)}else{Q.miss.push(q.d);wrong.add(key);mastered.delete(key)}
    save();
    const d=q.d,last=Q.i===Q.list.length-1;
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div class="v">${ok?"정답이에요!":"아쉬워요. 정답을 확인해요"}</div><div class="ww">${esc(d.w)} ${spkBtn(d.w+". "+d.m)}</div><div>${esc(d.m)}</div>${d.x?`<div style="color:var(--mute)">틀린 표기: ${esc(d.x)}</div>`:""}</div><button class="cta" id="qnext">${last?"결과 보기":"다음 문제"}</button>`;
    $("qnext").scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }
  if(e.target.closest("#qnext")){Q.i++;if(Q.i<Q.list.length)renderQ();else endQuiz();scrollTo(0,0)}
  if(e.target.closest("#qretry"))startQuiz(Q.miss.slice(),"틀린 문제 다시");
  if(e.target.closest("#qagain"))Q.exam?startExam():startQuiz();
});
function endQuiz(){
  $("qbar").style.width="100%";$("qn").textContent="";
  const n=Q.list.length,s=Q.score,msg=s===n?"모두 맞혔어요! 정말 잘했어요.":s>=n*.7?"잘했어요! 틀린 것만 한 번 더 보면 완벽해요.":"괜찮아요. 틀린 낱말을 다시 풀어 보면 금방 외워져요.";
  $("qbody").innerHTML=`<div class="qcard score"><div class="big">${s}<span style="font-size:.4em;color:var(--mute)"> / ${n}</span></div><p>${msg}</p></div>
  ${Q.miss.length?`<div class="qtype">틀린 낱말</div><div class="list">${Q.miss.map(d=>`<div class="li"><b>${esc(d.w)}</b><p>${esc(d.m)}</p><div class="acts">${spkBtn(d.w+". "+d.m)}</div></div>`).join("")}</div><button class="cta" id="qretry">틀린 문제 다시 풀기</button>`:""}
  <button class="${Q.miss.length?"ghost":"cta"}" id="qagain">${Q.exam?"실전 문제 다시 풀기":"새 문제 10개 풀기"}</button><button class="ghost" data-home>처음으로</button>`;
}

const L={list:[],i:0,playing:false,tok:0,mode:store.get("lmode","w"),gap:+store.get("lgap","4")};
const wait=ms=>new Promise(r=>{const h=setTimeout(r,ms);L.cancel=()=>{clearTimeout(h);r()}});
function lsegs(){[["lmode",L.mode],["lgap",String(L.gap)]].forEach(([id,v])=>$(id).querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v)))}
function lshow(reveal){const d=L.list[L.i];if(!d)return;$("ln").textContent=`${L.i+1} / ${L.list.length}`;$("ltag").textContent=`${d.s} · ${d.u}`;$("lw").textContent=d.w;$("lm").textContent=d.m;$("lw").className="prompt w"+(L.playing&&!reveal&&L.mode==="m"?" dim":"");$("lm").className="prompt"+(L.playing&&!reveal&&L.mode==="w"?" dim":"")}
function startListen(){$("lwarn").hidden=tts;L.list=pool();L.i=0;lsegs();lshow(true);$("lst").textContent="재생을 누르면 소리로 읽어 줘요."}
async function lloop(t){
  while(L.playing&&t===L.tok){
    const d=L.list[L.i];if(!d)break;lshow(false);
    if(L.mode==="w"){$("lst").textContent="낱말을 듣고 뜻을 떠올려 보세요";await say(d.w,t);if(t!==L.tok)return;await wait(L.gap*1000);if(t!==L.tok)return;lshow(true);$("lst").textContent="뜻";await say(d.m,t)}
    else{$("lst").textContent="뜻을 듣고 낱말을 맞혀 보세요";await say(d.m,t);if(t!==L.tok)return;$("lst").textContent="무엇일까요?";await wait(L.gap*1000);if(t!==L.tok)return;lshow(true);$("lst").textContent="정답";await say("정답, "+d.w,t)}
    if(t!==L.tok)return;await wait(1300);if(t!==L.tok)return;
    if(L.i<L.list.length-1)L.i++;else{await say("한 바퀴를 다 들었어요. 처음부터 다시 들을게요.",t);if(t!==L.tok)return;L.i=0}
  }
}
let lock=null;
async function wake(on){try{if(on&&navigator.wakeLock)lock=await navigator.wakeLock.request("screen");else if(lock){lock.release();lock=null}}catch(e){}}
function setPlay(on){L.playing=on&&tts;L.tok++;if(L.cancel)L.cancel();if(tts)speechSynthesis.cancel();$("lplay").textContent=L.playing?"멈춤":"재생";wake(L.playing);if(L.playing)lloop(L.tok);else{lshow(true);if(on===false&&$("listen").hidden===false)$("lst").textContent="멈췄어요. 재생을 누르면 이어서 들어요."}}
function stopListen(){if(L.playing)setPlay(false)}
$("lplay").onclick=()=>setPlay(!L.playing);
const ljump=k=>{if(!L.list.length)return;L.i=(L.i+k+L.list.length)%L.list.length;if(L.playing)setPlay(true);else lshow(true)};
$("lprev").onclick=()=>ljump(-1);$("lnext").onclick=()=>ljump(1);
["lmode","lgap"].forEach(id=>$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=b.dataset.v;if(id==="lmode")L.mode=v;else L.gap=+v;store.set(id,v);lsegs();if(L.playing)setPlay(true)});

  if(!src){const p=shuffle(tbPool().slice());p.sort((a,b)=>(tbWrong.has(b.id)-tbWrong.has(a.id))||(tbDone.has(a.id)-tbDone.has(b.id)));src=p.slice(0,12)}
  T.list=shuffle(src.slice());T.i=0;T.score=0;T.miss=[];
  $("tbtitle").textContent=title||"교과서 유형 문제";
  if(!T.list.length){$("tbbody").innerHTML=`<div class="empty">이 단원에는 교과서 유형 문제가 없어요.</div>`;return}
  tbRender();
}
function tbRender(){
  const q=T.list[T.i];T.sel=null;T.pairs={};T.seq=[];
  $("tbn").textContent=`${T.i+1} / ${T.list.length}`;$("tbbar").style.width=(T.i/T.list.length*100)+"%";
  let h=`<div class="qcard"><div class="qtype">${TYPE[q.t]}</div>`;
  if(q.t==="bogi")h+=`<div class="bogi"><b>보기</b><span>${q.bogi.map(esc).join("</span><span>")}</span></div>`;
  if(q.t==="chosung")h+=`<div class="prompt">${esc(q.q)}</div><div class="cho">${esc(q.h)}</div>`;
  else h+=`<div class="prompt">${blankify(q.q)}</div>${q.t==="short"?`<div class="hint">힌트: ${esc(q.h)}</div>`:""}`;
  h+=`<div class="tagl">${esc(q.s)} · ${esc(q.u)}</div></div><div id="tbin"></div><div id="tbfb"></div>`;
  $("tbbody").innerHTML=h;tbInput(q);
}
function optsOf(q){
  if(q.t==="ox")return{o:["O","X"],a:q.a?0:1};
  if(q.t==="bogi")return{o:q.bogi,a:q.bogi.indexOf(q.a)};
  return{o:q.o,a:q.a};
}
function tbInput(q){
  const box=$("tbin");
  if(["mc","choose","bogi","ox"].includes(q.t)){
    const {o}=optsOf(q),long=o.some(x=>x.length>10);
    box.innerHTML=`<div class="opts${q.t==="ox"?" oxs":""}">${o.map((x,k)=>`<button class="opt${long?"":" w"}${q.t==="ox"?" ox":""}" data-k="${k}">${q.t==="ox"?"":`<i>${k+1}</i>`}<span>${esc(x)}</span></button>`).join("")}</div>`;
  }else if(q.t==="chosung"||q.t==="short"){
    box.innerHTML=`<input id="tbtxt" class="txt" autocomplete="off" placeholder="정답을 써 보세요" enterkeyhint="done"><div class="two" style="margin-top:10px"><button class="ghost2" id="tbgive">정답 보기</button><button class="cta2" id="tbcheck">확인</button></div>`;
    $("tbtxt").addEventListener("keydown",e=>{if(e.key==="Enter")$("tbcheck").click()});
  }else if(q.t==="order"){
    T.shuf=shuffle(q.items.map((_,k)=>k));
    box.innerHTML=`<div class="seq" id="seq"></div><div class="chips" id="chips"></div><div class="two" style="margin-top:10px"><button class="ghost2" id="tbreset">다시 고르기</button><button class="cta2" id="tbcheck" disabled>확인</button></div>`;
    drawOrder(q);
  }else if(q.t==="match"){
    T.right=shuffle(q.pairs.map((_,k)=>k));
    box.innerHTML=`<p class="hint" style="margin:0 0 8px">왼쪽을 누른 다음, 알맞은 오른쪽을 누르세요.</p><div class="mt" id="mt"></div><button class="cta" id="tbcheck" disabled>확인</button>`;
    drawMatch(q);
  }else if(q.t==="essay"){
    box.innerHTML=`<textarea id="tbtxt" class="txt" rows="4" placeholder="생각을 써 보세요 (안 써도 돼요)"></textarea><button class="cta" id="tbshow">모범 답안 보기</button>`;
  }
}
function drawOrder(q){
  $("seq").innerHTML=T.seq.length?T.seq.map((k,n)=>`<div class="sq"><i>${n+1}</i>${esc(q.items[k])}</div>`).join(""):`<div class="hint">첫 번째로 일어난 일부터 누르세요.</div>`;
  $("chips").innerHTML=T.shuf.filter(k=>!T.seq.includes(k)).map(k=>`<button class="chip" data-o="${k}">${esc(q.items[k])}</button>`).join("");
  $("tbcheck").disabled=T.seq.length!==q.items.length;
}
function drawMatch(q){
  const used=Object.values(T.pairs);
  const lnum=l=>Object.keys(T.pairs).indexOf(String(l));
  $("mt").innerHTML=`<div class="mcol">${q.pairs.map((p,l)=>`<button class="mb${T.sel===l?" on":""}${T.pairs[l]!=null?" done":""}" data-l="${l}">${T.pairs[l]!=null?`<i>${lnum(l)+1}</i>`:""}${esc(p[0])}</button>`).join("")}</div><div class="mcol">${T.right.map(r=>{const l=Object.keys(T.pairs).find(k=>T.pairs[k]===r);return `<button class="mb${l!=null?" done":""}" data-r="${r}">${l!=null?`<i>${lnum(l)+1}</i>`:""}${esc(q.pairs[r][1])}</button>`}).join("")}</div>`;
  $("tbcheck").disabled=Object.keys(T.pairs).length!==q.pairs.length;
}
function tbGrade(ok,ansHtml,selfMark){
  const q=T.list[T.i];
  tbDone.add(q.id);if(ok){T.score++;tbWrong.delete(q.id)}else{T.miss.push(q);tbWrong.add(q.id)}tbSave();
  const b=$("blank");if(b&&(q.t==="choose"||q.t==="bogi"||q.t==="short")){const {o,a}=q.t==="short"?{o:q.a,a:0}:optsOf(q);b.textContent=" "+o[a]+" ";b.classList.add("fill")}
  const last=T.i===T.list.length-1;
  $("tbfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div class="v">${selfMark?"모범 답안":ok?"정답이에요!":"아쉬워요. 정답을 확인해요"}</div>${ansHtml?`<div>${ansHtml}</div>`:""}${q.e?`<div style="color:var(--mute)">${esc(q.e)}</div>`:""}</div><button class="cta" id="tbnext">${last?"결과 보기":"다음 문제"}</button>`;
  $("tbnext").scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("tbbody").addEventListener("click",e=>{
  const q=T.list[T.i];if(!q)return;const t=e.target;
  const ob=t.closest(".opt");
  if(ob&&!ob.disabled){const {o,a}=optsOf(q),k=+ob.dataset.k;document.querySelectorAll("#tbin .opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===a)x.classList.add("ok");else if(x===ob)x.classList.add("no")});tbGrade(k===a,q.t==="mc"?`<b>정답: ${esc(o[a])}</b>`:"");return}
  if(t.closest("#tbcheck")&&(q.t==="chosung"||q.t==="short")){const v=norm($("tbtxt").value);if(!v){$("tbtxt").focus();return}const ok=q.a.some(a=>norm(a)===v);$("tbtxt").disabled=true;$("tbcheck").disabled=true;$("tbgive").disabled=true;tbGrade(ok,`<b class="big2">정답: ${esc(q.a[0])}</b>${ok?"":`<br><span style="color:var(--mute)">내가 쓴 답: ${esc($("tbtxt").value)}</span>`}`);return}
  if(t.closest("#tbgive")){$("tbtxt").disabled=true;$("tbcheck").disabled=true;$("tbgive").disabled=true;tbGrade(false,`<b class="big2">정답: ${esc(q.a[0])}</b>`);return}
  const ch=t.closest(".chip");if(ch){T.seq.push(+ch.dataset.o);drawOrder(q);return}
  if(t.closest("#tbreset")){T.seq=[];drawOrder(q);return}
  if(t.closest("#tbcheck")&&q.t==="order"){const ok=T.seq.every((k,n)=>k===n);document.querySelectorAll("#tbin button").forEach(x=>x.disabled=true);$("seq").innerHTML=T.seq.map((k,n)=>`<div class="sq ${k===n?"good":"bad"}"><i>${n+1}</i>${esc(q.items[k])}</div>`).join("");tbGrade(ok,ok?"":`<b>바른 차례</b><ol class="ol">${q.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`);return}
  const mb=t.closest(".mb");
  if(mb&&!mb.disabled&&q.t==="match"){
    if(mb.dataset.l!=null){const l=+mb.dataset.l;if(T.pairs[l]!=null)delete T.pairs[l];T.sel=l}
    else if(T.sel!=null){const r=+mb.dataset.r;for(const k in T.pairs)if(T.pairs[k]===r)delete T.pairs[k];T.pairs[T.sel]=r;T.sel=null}
    drawMatch(q);return}
  if(t.closest("#tbcheck")&&q.t==="match"){const ok=q.pairs.every((_,l)=>T.pairs[l]===l);document.querySelectorAll("#mt [data-l]").forEach(x=>{const l=+x.dataset.l;x.classList.add(T.pairs[l]===l?"good":"bad")});document.querySelectorAll("#mt [data-r]").forEach(x=>{const r=+x.dataset.r,l=Object.keys(T.pairs).find(k=>T.pairs[k]===r);x.classList.add(+l===r?"good":"bad")});document.querySelectorAll("#tbin button").forEach(x=>x.disabled=true);tbGrade(ok,`<b>바른 연결</b><ul class="ol">${q.pairs.map(p=>`<li>${esc(p[0])} — ${esc(p[1])}</li>`).join("")}</ul>`);return}
  if(t.closest("#tbshow")){$("tbshow").remove();$("tbtxt").disabled=true;
    $("tbfb").innerHTML=`<div class="fb ok"><div class="v">모범 답안</div><div>${esc(q.a).replace(/ \/ /g,"<br>또는 ")}</div></div><p class="hint" style="margin:12px 0 6px">내 답과 비교해 보세요. 비슷하게 썼나요?</p><div class="two"><button class="k" id="eno">다시 볼래요</button><button class="y" id="eyes">맞게 썼어요</button></div>`;return}
  if(t.closest("#eyes")||t.closest("#eno")){const ok=!!t.closest("#eyes");T.score+=ok?1:0;tbDone.add(q.id);if(ok)tbWrong.delete(q.id);else{T.miss.push(q);tbWrong.add(q.id)}tbSave();T.i++;T.i<T.list.length?tbRender():tbEnd();scrollTo(0,0);return}
  if(t.closest("#tbnext")){T.i++;T.i<T.list.length?tbRender():tbEnd();scrollTo(0,0);return}
  if(t.closest("#tbretry")){startTB(T.miss.slice(),"틀린 문제 다시");return}
  if(t.closest("#tbagain")){startTB();return}
});
function tbEnd(){
  $("tbbar").style.width="100%";$("tbn").textContent="";
  const n=T.list.length,s=T.score;
  $("tbbody").innerHTML=`<div class="qcard score"><div class="big">${s}<span style="font-size:.4em;color:var(--mute)"> / ${n}</span></div><p>${s===n?"모두 맞혔어요! 시험 준비 완벽해요.":s>=n*.7?"잘했어요! 틀린 문제만 다시 풀어 봐요.":"괜찮아요. 틀린 문제를 다시 풀면 금방 익숙해져요."}</p></div>
  ${T.miss.length?`<div class="qtype">틀린 문제</div><div class="list">${T.miss.map(q=>`<div class="li"><b style="font-size:16px">${TYPE[q.t]}</b><p>${esc(q.q)}</p></div>`).join("")}</div><button class="cta" id="tbretry">틀린 문제 다시 풀기</button>`:""}
  <button class="${T.miss.length?"ghost":"cta"}" id="tbagain">새 문제 풀기</button><button class="ghost" data-home>처음으로</button>`;
}

renderHome();
}
</script>
</body>
</html>
